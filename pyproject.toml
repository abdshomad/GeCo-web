[project]
name = "geco"
version = "0.1.0"
description = "A Novel Unified Architecture for Low-Shot Counting by Detection and Segmentation"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "matplotlib>=3.5.0",
    "pillow>=9.0.0",
    "numpy>=1.21.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    "gdown>=4.7.0",
]

[project.optional-dependencies]
evaluation = [
    "tqdm>=4.64.0",
    "pycocotools>=2.0.0",
    "scipy>=1.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["models", "utils", "segment_anything"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

